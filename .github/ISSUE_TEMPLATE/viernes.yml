name: Solicitud de Invitado para Open Source Viernes
description: Complete este formulario para solicitar ser invitado en Open Source Friday
title: Open Source Friday - [NOMBRE DEL PROYECTO] - [DD-MM-AAAA]
labels: ["open-source-viernes", "open-source", "twitch", "pending", "spanish"]
assignees: 
  - AndreaGriffiths11
  - KevinCrosby
  - marlenezw
  - madebygps
  - crazy4pi314
body:
  - type: markdown
    attributes:
      value: |
        ## Formulario de Invitación para Invitados de Open Source Friday
        #### :sparkles: Por favor, complete la siguiente información para ser invitado a Open Source Viernes. La fecha de la transmisión ser confirmada al aprovar el invitado :sparkles:

        **No necesitas una fecha para enviar tu solicitud.** Revisamos cada propuesta y, cuando tu proyecto sea aprobado, aplicaremos la etiqueta `approved` y un bot dejará un comentario en este issue con el enlace al calendario para que reserves tu transmisión. Si ya tienes una fecha en mente, inclúyela abajo — si no, marca "Aún no" y nosotros nos encargamos del resto.
  - type: input
    id: nombre
    attributes:
      label: Nombre
      description: Su nombre
      placeholder: "Andrea Griffiths"
  - type: input
    id: github_user
    attributes:
      label: Usuario de GitHub
      description: Su nombre de usuario en GitHub
      placeholder: "@AndreaGriffiths11"
  - type: textarea
    id: acerca_de_ti
    attributes:
      label: Háblanos de ti
      description: Por favor, comparte un poco sobre ti y tu experiencia
      placeholder: "Soy un desarrollador que..."
  - type: input
    id: nombre_proyecto_1
    attributes:
      label: Nombre del Proyecto
      description: El nombre del proyecto que te gustaría mostrar y sobre el que quieres hablar
      placeholder: "Proyecto Increíble"
  - type: input
    id: repo_proyecto_1
    attributes:
      label: Enlace al Repositorio del Proyecto
      description: El repositorio de GitHub de tu proyecto
      placeholder: "github.com/url-del-repo"
  - type: checkboxes
    id: fecha_transmision
    attributes:
      label: Fecha de Transmisión
      description: "¿Ya escogiste una fecha en https://gh.io/osf-booking? Cuéntanos. Si no, marca \"Aún no\" — te enviaremos el enlace para reservar cuando tu solicitud sea aprobada."
      options:
        - label: "Sí"
        - label: "Aún no"
  - type: textarea
    id: social_links
    attributes:
      label: Enlaces a redes sociales
      description: "Opcional: Comparte enlaces a los perfiles sociales que quieras que usemos para promocionar tu transmisión (LinkedIn, Mastodon, Bluesky, X o cualquier otra plataforma). Añade una URL por línea."
      placeholder: |
        https://www.linkedin.com/in/tu-perfil
        https://mastodon.social/@tu-perfil
        https://bsky.app/profile/tu-perfil.bsky.social
        https://x.com/tu-perfil
  - type: textarea
    id: mas_info
    attributes:
      label: Información Adicional
      description: Por favor, comparte cualquier detalle adicional que quieras que sepamos sobre tu proyecto
      placeholder: "Me gustaría hablar sobre..."
